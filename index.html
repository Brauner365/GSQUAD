<title>Guildford FC - Squad Profiles</title>
<style>
  :root{
    --red:#C8102E; --red-lt:#e11d38; --bg:#07100d; --panel:#141013;
    --panel-2:#1b1518; --line:#2a2024; --txt:#f4eef0; --muted:#8a7d82; --teal:#00E0C6;
    --cream:#ece6da;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg); color:var(--txt);
    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; min-height:100vh;
    background-image:linear-gradient(rgba(200,16,46,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(200,16,46,.05) 1px,transparent 1px);
    background-size:44px 44px;}
  header{position:relative; padding:52px 40px 0; border-bottom:2px solid var(--red);
    background:linear-gradient(180deg,rgba(200,16,46,.10),transparent 70%);}
  .hrow{display:flex; align-items:center; justify-content:space-between; padding-bottom:20px;}
  .hublink{display:inline-flex;align-items:center;gap:7px;text-decoration:none;position:absolute;top:18px;left:40px;z-index:5;
    background:rgba(200,16,46,.12);border:1px solid rgba(200,16,46,.4);color:#f4eef0;
    font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:7px 13px;border-radius:20px;transition:.15s;}
  .hublink:hover{background:rgba(200,16,46,.25);border-color:var(--red);}
  .hublink svg{width:13px;height:13px;stroke:var(--teal);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .brand{display:flex; align-items:center; gap:18px;}
  .crest{height:66px; width:auto; flex:none;}
  .titles h1{font-size:32px; letter-spacing:1px; font-weight:800; line-height:1; font-style:italic; text-transform:uppercase;}
  .titles .sub{color:var(--muted); font-size:11px; letter-spacing:3px; text-transform:uppercase; margin-top:6px; font-weight:600;}
  .omen{color:var(--teal); font-weight:700; letter-spacing:2px;}
  .count{text-align:right; position:relative; z-index:1;}
  .count .lab{color:var(--muted); font-size:11px; letter-spacing:3px; font-weight:600;}
  .count .num{font-size:34px; font-weight:800; color:var(--red-lt); line-height:1; background:var(--bg); display:inline-block; padding:2px 6px; border-radius:4px;}
  .wrap{max-width:1040px; margin:0 auto; padding:26px 20px 80px;}
  .tabs{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;}
  .tab{background:var(--panel-2); color:var(--muted); border:1px solid var(--line);
    padding:9px 20px; border-radius:20px; font-size:12px; font-weight:700; letter-spacing:1px;
    cursor:pointer; transition:.15s; text-transform:uppercase;}
  .tab:hover{color:var(--txt); border-color:var(--red);}
  .tab.active{background:var(--red); color:#fff; border-color:var(--red);}
  .status{font-size:11px; letter-spacing:1px; color:var(--muted); margin-bottom:24px; min-height:14px;}
  .status .ok{color:var(--teal);} .status .warn{color:#f0a000;} .status .err{color:var(--red-lt);}
  .group{margin-bottom:34px;}
  .ghead{display:flex; align-items:baseline; gap:12px; margin-bottom:14px; border-bottom:1px solid var(--line); padding-bottom:10px;}
  .ghead h2{font-size:22px; font-weight:800; font-style:italic; text-transform:uppercase; letter-spacing:.5px;}
  .ghead .gcount{color:var(--red-lt); font-size:12px; font-weight:700; letter-spacing:2px;}
  .row{display:flex; align-items:center; gap:16px; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:10px 16px; margin-bottom:8px; transition:.15s; cursor:pointer;}
  .row:hover{border-color:var(--red); background:var(--panel-2);}
  .num{width:38px; height:38px; flex:none; border-radius:50%; background:var(--red); color:#fff;
    font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 3px rgba(200,16,46,.18);}
  .photo{width:46px; height:46px; flex:none; border-radius:50%; object-fit:cover; border:2px solid var(--line); background:var(--panel-2);}
  .pname{flex:1; font-weight:700; font-size:16px;}
  .pos{border:1px solid var(--line); color:var(--muted); font-size:11px; font-weight:700; letter-spacing:1px; padding:4px 10px; border-radius:5px;}
  .chev{color:var(--muted); font-size:18px; margin-left:12px;}
  .medbadge{font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; padding:4px 9px; border-radius:20px; margin-right:4px; white-space:nowrap;}
  .medbadge.med-out{background:rgba(200,16,46,.18); color:#ff5a72;}
  .medbadge.med-doubt{background:rgba(240,160,0,.18); color:#f0a000;}
  .medbadge.med-pend{background:rgba(138,125,130,.2); color:var(--muted);}
  .medlock{background:#efe7d8; border:1px solid #cfc7ba; border-radius:6px; padding:10px 14px; margin-bottom:22px; font-size:12px; color:#7a2030; font-weight:700; display:flex; align-items:center; gap:8px;}
  .medlock .dot2{width:8px;height:8px;border-radius:50%;background:#C8102E;flex:none;}

  /* Slide-in panel */
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:.2s; z-index:40;}
  .scrim.show{opacity:1; pointer-events:auto;}
  .panel{position:fixed; top:0; right:0; height:100%; width:min(700px,100%);
    background:var(--cream); color:#222; transform:translateX(100%); transition:.28s cubic-bezier(.4,0,.2,1);
    z-index:50; overflow-y:auto; box-shadow:-8px 0 40px rgba(0,0,0,.5);}
  .panel.show{transform:translateX(0);}
  .pbar{height:5px; background:var(--red);}
  .phead{display:flex; align-items:center; gap:16px; padding:22px 26px 10px;}
  .phead .ph{width:60px;height:60px;border-radius:50%;object-fit:cover;border:3px solid var(--red);}
  .phead .pn{font-size:22px; font-weight:800;}
  .phead .pmeta{color:#7a2030; font-weight:700; font-size:12px; letter-spacing:1px; text-transform:uppercase;}
  .pclose{margin-left:auto; background:none; border:none; font-size:26px; cursor:pointer; color:#555; line-height:1;}
  .pbody{padding:6px 26px 30px;}
  .focusrow{display:flex; gap:18px; align-items:flex-start; margin:14px 0 22px;}
  .pitch{width:150px;height:210px;flex:none;border-radius:4px;}
  .focustext h3{color:var(--red); font-size:12px; letter-spacing:2px; margin-bottom:8px;}
  .focustext p{font-size:14px; color:#444; line-height:1.5;}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); border:1px solid #cfc7ba; border-radius:6px; overflow:hidden; margin-bottom:2px;}
  .stat{padding:12px 14px; border-right:1px solid #cfc7ba; background:#f4f0e8;}
  .stat:last-child{border-right:none;}
  .stat label{display:block; font-size:10px; letter-spacing:1.5px; color:#8a8172; font-weight:700; margin-bottom:4px;}
  .stat input{width:100%; border:none; background:none; font-size:20px; font-weight:800; color:#222; outline:none;}
  .selrow{display:grid; grid-template-columns:repeat(3,1fr); border:1px solid #cfc7ba; border-top:none; border-radius:0 0 6px 6px; overflow:hidden; margin-bottom:22px;}
  .selc{padding:10px 14px; border-right:1px solid #cfc7ba; background:#eee7db;}
  .selc:last-child{border-right:none;}
  .selc label{display:block; font-size:10px; letter-spacing:1.5px; color:#8a8172; font-weight:700; margin-bottom:4px;}
  .selc select{width:100%; border:none; background:none; font-size:15px; font-weight:600; color:#222; outline:none; cursor:pointer;}
  .field{margin-bottom:18px;}
  .field label{display:block; color:var(--red); font-size:12px; letter-spacing:2px; font-weight:700; margin-bottom:8px;}
  .field textarea{width:100%; min-height:74px; resize:vertical; border:1px solid #cfc7ba; border-radius:6px;
    background:#f4f0e8; padding:12px; font-size:14px; color:#333; font-family:inherit; outline:none;}
  .field textarea:focus{border-color:var(--red);}
  .save{display:flex; justify-content:flex-end; margin-top:8px;}
  .save button{background:var(--red); color:#fff; border:none; padding:14px 34px; border-radius:5px;
    font-weight:800; letter-spacing:2px; font-size:13px; cursor:pointer;}
  .save button:hover{background:var(--red-lt);}
  .save button:disabled{opacity:.5; cursor:default;}
  .savenote{align-self:center; margin-right:14px; font-size:12px; color:#2a7d5f; font-weight:700;}
  @media(max-width:600px){
    header{padding:20px 18px 0;} .wrap{padding:20px 14px 60px;}
    .titles h1{font-size:22px;} .count .num{font-size:26px;} .photo{width:40px;height:40px;}
    .focusrow{flex-direction:column;} .pitch{width:130px;height:182px;}
  }
</style>
</head>

];
var FOCUS={"GK": "Sits deepest on the sheet. Focus notes on shot-stopping, command of the box and distribution.", "FB": "Provides width and overlaps. Focus on 1v1 defending, recovery pace and crossing quality.", "CB": "Anchors the back line. Focus on aerial dominance, positioning and composure in possession.", "MID": "Controls tempo through the middle. Focus on press resistance, range of passing and box-to-box work rate.", "WING": "Attacks the half-spaces and touchline. Focus on take-ons, end product and defensive tracking.", "FWD": "Leads the line. Focus on finishing, movement in behind and hold-up play."};
var POSGROUPS=[["GK","Goalkeepers"],["FB","Full Backs"],["CB","Centre Backs"],
  ["MID","Midfielders"],["WING","Wingers"],["FWD","Forwards"]];
var STATE={};   // id -> full data blob
var filter="ALL", current=null;

function pad(n){return n<10?("0"+n):(""+n);}
function seedById(id){for(var i=0;i<SEED.length;i++){if(SEED[i].id===id)return SEED[i];}return null;}
function posOf(id){var d=STATE[id]||{}; return (d.primaryPos||"").toUpperCase()||"UNASSIGNED";}

function setStatus(html,cls){document.getElementById("status").innerHTML='<span class="'+(cls||"")+'">'+html+'</span>';}

function apiHeaders(){return {"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"};}

function loadSquad(){
  fetch(SB_URL+"/rest/v1/squad_players?select=id,player_name,data",{headers:apiHeaders()})
   .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
   .then(function(rows){
      rows.forEach(function(r){STATE[r.id]=r.data||{};});
      setStatus("Live &middot; synced from cloud","ok");
      render();
      loadMedical().then(render);
   })
   .catch(function(e){
      setStatus("Offline &mdash; showing squad, changes won't save ("+e.message+")","warn");
      SEED.forEach(function(s){if(!STATE[s.id])STATE[s.id]={order:s.n};});
      render();
   });
}

function groupCode(id){
  var p=posOf(id);
  var valid=["GK","FB","CB","MID","WING","FWD"];
  return valid.indexOf(p)>=0?p:"UNASSIGNED";
}

function buildTabs(){
  var t=document.getElementById("tabs");
  var cats=["ALL","GK","FB","CB","MID","WING","FWD"];
  t.innerHTML="";
  cats.forEach(function(c){
    var b=document.createElement("div");
    b.className="tab"+(c===filter?" active":"");
    b.textContent=c;
    b.onclick=function(){filter=c;buildTabs();render();};
    t.appendChild(b);
  });
}

function render(){
  var host=document.getElementById("squad"); host.innerHTML="";
  var shown=0, anyUnassigned=false;
  var groups=POSGROUPS.concat([["UNASSIGNED","Unassigned"]]);
  groups.forEach(function(g){
    var code=g[0],label=g[1];
    if(filter!=="ALL" && filter!==code) return;
    var list=SEED.filter(function(s){return groupCode(s.id)===code;})
                 .sort(function(a,b){return a.n-b.n;});
    if(!list.length) return;
    if(code==="UNASSIGNED")anyUnassigned=true;
    shown+=list.length;
    var sec=document.createElement("div");sec.className="group";
    var head=document.createElement("div");head.className="ghead";
    head.innerHTML='<h2>'+label+'</h2><span class="gcount">'+pad(list.length)+' PLAYERS</span>';
    sec.appendChild(head);
    list.forEach(function(s){
      var d=STATE[s.id]||{};
      var pos=groupCode(s.id)==="UNASSIGNED"?"&mdash;":posOf(s.id);
      var r=document.createElement("div");r.className="row";
      r.onclick=function(){openPanel(s.id);};
      var med=medStatusFor(s.name);
      var medBadge="";
      if(med){
        var mc = med.availability==="unavailable" ? "med-out" : (med.availability==="doubtful" ? "med-doubt" : "med-pend");
        medBadge='<div class="medbadge '+mc+'" title="'+(med.body_area||"")+' — from Medical Desk">'+(MED_LABEL[med.availability]||med.availability)+'</div>';
      }
      r.innerHTML='<img class="photo" src="'+s.img+'" alt="" onerror="this.style.visibility=\'hidden\'">'+
        '<div class="pname">'+s.name+'</div>'+
        medBadge+
        '<div class="pos">'+pos+'</div><div class="chev">&rsaquo;</div>';
      sec.appendChild(r);
    });
    host.appendChild(sec);
  });
  document.getElementById("pcount").textContent=filter==="ALL"?SEED.length:shown;
}

/* ---- pitch svg with position dot ---- */
function pitchSVG(pos){
  var dot={GK:[50,124],FB:[22,96],CB:[50,104],MID:[50,74],WING:[80,50],FWD:[50,30]}[pos]||[50,70];
  var s='';
  s+='<rect x="0" y="0" width="100" height="140" fill="#20372c"/>';
  s+='<rect x="4" y="4" width="92" height="132" fill="none" stroke="#5c7565" stroke-width="1"/>';
  s+='<line x1="4" y1="70" x2="96" y2="70" stroke="#5c7565" stroke-width="1"/>';
  s+='<circle cx="50" cy="70" r="12" fill="none" stroke="#5c7565" stroke-width="1"/>';
  s+='<rect x="28" y="4" width="44" height="20" fill="none" stroke="#5c7565" stroke-width="1"/>';
  s+='<rect x="40" y="4" width="20" height="9" fill="none" stroke="#5c7565" stroke-width="1"/>';
  s+='<rect x="28" y="116" width="44" height="20" fill="none" stroke="#5c7565" stroke-width="1"/>';
  s+='<rect x="40" y="127" width="20" height="9" fill="none" stroke="#5c7565" stroke-width="1"/>';
  s+='<circle cx="'+dot[0]+'" cy="'+dot[1]+'" r="7" fill="#C8102E" stroke="#fff" stroke-width="2"/>';
  return s;
}

/* ---- open / populate panel ---- */
function openPanel(id){
  current=id;
  var s=seedById(id), d=STATE[id]||{};
  document.getElementById("pph").src=s.img;
  document.getElementById("ppn").textContent=s.name;
  var pos=posOf(id); var showPos=(pos==="UNASSIGNED")?"":pos;
  document.getElementById("ppm").textContent="#"+s.n+(showPos?"  \u00b7  "+showPos:"");
  document.getElementById("ppitch").innerHTML=pitchSVG(showPos);
  document.getElementById("pfocus").textContent=FOCUS[showPos]||"Assign a primary position in the tactical app to tailor the scouting focus for this player.";
  // stats from matches blob
  var apps=0,goals=0,assists=0,mch=d.matches||{};
  Object.keys(mch).forEach(function(k){var m=mch[k]; if(m.sel)apps++; goals+=(+m.goal||0); assists+=(+m.assist||0);});
  document.getElementById("f_apps").value = (d.apps!=null?d.apps:apps);
  document.getElementById("f_goals").value = (d.goalsTotal!=null?d.goalsTotal:goals);
  document.getElementById("f_assists").value = (d.assistsTotal!=null?d.assistsTotal:assists);
  var med=medStatusFor(s.name);
  var lock=document.getElementById("medlock"), lockTxt=document.getElementById("medlock_txt"), fit=document.getElementById("f_fit");
  if(med){
    lock.style.display="flex";
    lockTxt.innerHTML="Fitness managed by <b>Medical Desk</b>: "+(MED_LABEL[med.availability]||med.availability)+(med.body_area?" ("+med.body_area+")":"");
    setSel("f_fit", med.availability==="unavailable"?"Injured":(med.availability==="doubtful"?"Doubtful":"Available"));
    fit.disabled=true; fit.style.opacity=".55";
  } else {
    lock.style.display="none"; fit.disabled=false; fit.style.opacity="1";
    setSel("f_fit", d.fitness||"Available");
  }
  setSel("f_sec", d.secondaryPos||"None");
  setSel("f_foot", d.foot||"Right");
  document.getElementById("f_str").value=d.strengths||"";
  document.getElementById("f_dev").value=d.areasToDevelop||"";
  document.getElementById("f_notes").value=d.notes||"";
  document.getElementById("savenote").textContent="";
  document.getElementById("scrim").classList.add("show");
  document.getElementById("panel").classList.add("show");
}
function setSel(id,val){var el=document.getElementById(id);for(var i=0;i<el.options.length;i++){if(el.options[i].value===val||el.options[i].text===val){el.selectedIndex=i;return;}}el.selectedIndex=0;}
function closePanel(){document.getElementById("scrim").classList.remove("show");document.getElementById("panel").classList.remove("show");current=null;}

document.getElementById("pclose").onclick=closePanel;
document.getElementById("scrim").onclick=closePanel;
document.addEventListener("keydown",function(e){if(e.key==="Escape")closePanel();});

/* ---- save (merge into data blob, PATCH row) ---- */
document.getElementById("psave").onclick=function(){
  if(!current)return;
  var btn=this; var note=document.getElementById("savenote");
  var d=Object.assign({},STATE[current]||{});
  d.apps=+document.getElementById("f_apps").value||0;
  d.goalsTotal=+document.getElementById("f_goals").value||0;
  d.assistsTotal=+document.getElementById("f_assists").value||0;
  d.fitness=document.getElementById("f_fit").value;
  d.secondaryPos=document.getElementById("f_sec").value;
  d.foot=document.getElementById("f_foot").value;
  d.strengths=document.getElementById("f_str").value;
  d.areasToDevelop=document.getElementById("f_dev").value;
  d.notes=document.getElementById("f_notes").value;
  btn.disabled=true; note.style.color="#7a2030"; note.textContent="Saving...";
  fetch(SB_URL+"/rest/v1/squad_players?id=eq."+current,{
    method:"PATCH",
    headers:Object.assign(apiHeaders(),{"Prefer":"return=minimal"}),
    body:JSON.stringify({data:d})
  }).then(function(r){
    if(!r.ok)throw new Error(r.status);
    STATE[current]=d; note.style.color="#2a7d5f"; note.textContent="Saved \u2713";
    render();
    setTimeout(function(){note.textContent="";},2500);
  }).catch(function(e){
    note.style.color="#C8102E"; note.textContent="Save failed ("+e.message+")";
  }).finally(function(){btn.disabled=false;});
};

buildTabs();
loadSquad();
</script>
